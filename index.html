<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OrbitalAgro — Dashboard IoT</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap');

    :root {
      --bg: #0a0f0a;
      --panel: #121a12;
      --border: #1e3323;
      --green: #00ff88;
      --yellow: #ffd600;
      --red: #ff3860;
      --blue: #00c8ff;
      --terra: #b87333;
      --text: #cce0cc;
      --dim: #4f7055;
      --glow-g: 0 0 18px #00ff8866;
      --glow-y: 0 0 18px #ffd60066;
      --glow-r: 0 0 18px #ff386066;
      --glow-b: 0 0 32px #00c8ff88;
    }

        * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      font-family: 'Rajdhani', sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 20%, #ffffff11, transparent),
        radial-gradient(1px 1px at 40% 60%, #ffffff08, transparent),
        radial-gradient(1px 1px at 70% 10%, #00ff8815, transparent),
        radial-gradient(1px 1px at 85% 75%, #ffffff10, transparent),
        radial-gradient(1px 1px at 55% 40%, #ffffff05, transparent);
      pointer-events: none;
      z-index: 0;
    }

        .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px;
    }


       header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 18px;
      margin-bottom: 28px;
    }

        .logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }
